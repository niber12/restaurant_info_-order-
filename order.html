<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - K-DAK</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f5f5f5;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;
        }

        .container{
            background:white;
            width:90%;
            max-width:600px;

            padding:50px;

            text-align:center;

            border-radius:15px;

            box-shadow:0 5px 20px rgba(0,0,0,0.15);
        }

        .check{
            font-size:80px;
            color:#d60000;
            margin-bottom:20px;
        }

        h1{
            color:#d60000;
            margin-bottom:15px;
        }

        p{
            color:#555;
            font-size:18px;
            margin-bottom:30px;
            line-height:1.6;
        }

        .home-btn{
            display:inline-block;
            background:#d60000;
            color:white;
            text-decoration:none;
            padding:12px 30px;
            border-radius:5px;
            font-weight:bold;
            transition:0.3s;
        }

        .home-btn:hover{
            background:#a80000;
        }

    </style>

</head>
<body>

    <div class="container">

        <div class="check">✓</div>

        <h1>Order Confirmed!</h1>

        <p>
            Thank you for choosing K-DAK Chicken.<br>
            Your order has been received successfully and will be prepared shortly.
        </p>

        <a href="index.html" class="home-btn">
            Back to Home
        </a>

    </div>

</body>
</html>
